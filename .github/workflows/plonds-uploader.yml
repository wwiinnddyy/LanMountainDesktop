name: PLONDS Publisher

concurrency:
  group: plonds-publish
  cancel-in-progress: false

# 由 PLONDS Comparator 成功后显式 dispatch，或手动指定 tag 运行。
# 不再监听 workflow_run：Comparator 现在由 Release 用 GITHUB_TOKEN dispatch，
# GitHub 不会为 GITHUB_TOKEN 发起的运行再创建 workflow_run 下游运行。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  PLONDS_S3_PREFIX: lanmountain/update/plonds
  PLONDS_S3_PUBLIC_BASE_KEY_PREFIX: ''
  # GitHub runner 到 Rainyun S3 的跨境链路对持续大流量上传极不稳定（连接重置）。
  # 策略：限速慢传 + 1MB 小分片（每个分片几秒内传完，落在干扰窗口之外）+ 强制 HTTP/1.1
  #       + 12 次退避重试（上限 120s）。即使全部失败，enrich 步骤已保证 GitHub 通道可用。
  PLONDS_S3_DIRECTORY_UPLOAD_CONCURRENCY: '1'
  PLONDS_S3_MULTIPART_THRESHOLD_MB: '1'
  PLONDS_S3_MULTIPART_PART_SIZE_MB: '1'
  PLONDS_S3_MULTIPART_CONCURRENCY: '1'
  PLONDS_S3_UPLOAD_ATTEMPTS: '12'
  PLONDS_S3_UPLOAD_RETRY_MAX_DELAY_SECONDS: '120'
  PLONDS_S3_UPLOAD_RATE_KBPS: '128'
  PLONDS_S3_FORCE_HTTP1: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${{ github.event.inputs.tag }}"
          if [[ "$RAW_TAG" == v* ]]; then
            TAG="$RAW_TAG"
          else
            TAG="v$RAW_TAG"
          fi

          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName >/dev/null
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Build PLONDS tool
        run: dotnet build PenguinLogisticsOnlineNetworkDistributionSystem/src/Plonds.Tool/Plonds.Tool.csproj -c Release

      - name: Download PLONDS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plonds-assets
          mkdir -p plonds-assets
          gh release download "$RELEASE_TAG" -p changed-windows-${{ matrix.arch }}.zip -p PLONDS-windows-${{ matrix.arch }}.json -p files-windows-${{ matrix.arch }}.zip -D plonds-assets --clobber
          test -f plonds-assets/changed-windows-${{ matrix.arch }}.zip
          test -f plonds-assets/PLONDS-windows-${{ matrix.arch }}.json
          test -f plonds-assets/files-windows-${{ matrix.arch }}.zip
          jq -e . plonds-assets/PLONDS-windows-${{ matrix.arch }}.json >/dev/null
          echo "RELEASE_CHANNEL=$(jq -r .channel plonds-assets/PLONDS-windows-${{ matrix.arch }}.json)" >> "$GITHUB_ENV"

      - name: Enrich manifest and publish to GitHub channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project PenguinLogisticsOnlineNetworkDistributionSystem/src/Plonds.Tool/Plonds.Tool.csproj --configuration Release -- \
            enrich-manifest \
            --manifest "$PWD/plonds-assets/PLONDS-windows-${{ matrix.arch }}.json" \
            --changed-zip "$PWD/plonds-assets/changed-windows-${{ matrix.arch }}.zip" \
            --files-zip "$PWD/plonds-assets/files-windows-${{ matrix.arch }}.zip" \
            --release-tag "$RELEASE_TAG" \
            --repository "${{ github.repository }}" \
            --write-legacy-copy

          gh release upload "$RELEASE_TAG" "plonds-assets/PLONDS-windows-${{ matrix.arch }}.json" --clobber
          if [[ "${{ matrix.arch }}" == x64 && -f plonds-assets/PLONDS.json ]]; then
            gh release upload "$RELEASE_TAG" plonds-assets/PLONDS.json --clobber
          fi

      - name: Publish PLONDS assets to Rainyun S3
        continue-on-error: true
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${S3_ACCESS_KEY:-}" || -z "${S3_SECRET_KEY:-}" || -z "${S3_ENDPOINT:-}" || -z "${S3_BUCKET:-}" ]]; then
            echo "S3_ACCESS_KEY, S3_SECRET_KEY, S3_ENDPOINT, and S3_BUCKET must be configured."
            exit 1
          fi

          # 本步骤失败（runner 到 Rainyun 的连接重置）不阻塞 GitHub 回退通道——
          # enrich 步骤已保证 Release 上的清单自洽；S3 成功时清单会被升级为含 S3 地址。
          REGION="${S3_REGION:-us-east-1}"
          PUBLIC_BASE="${S3_PUBLIC_BASE_URL:-https://cn-nb1.rains3.com/lmdesktop}"
          PUBLIC_BASE="${PUBLIC_BASE%/}"

          dotnet run --project PenguinLogisticsOnlineNetworkDistributionSystem/src/Plonds.Tool/Plonds.Tool.csproj --configuration Release -- \
            publish-s3 \
            --release-tag "$RELEASE_TAG" \
            --repository "${{ github.repository }}" \
            --manifest "$PWD/plonds-assets/PLONDS-windows-${{ matrix.arch }}.json" \
            --changed-zip "$PWD/plonds-assets/changed-windows-${{ matrix.arch }}.zip" \
            --files-zip "$PWD/plonds-assets/files-windows-${{ matrix.arch }}.zip" \
            --work-dir "$PWD/plonds-publish-work" \
            --s3-prefix "$PLONDS_S3_PREFIX/windows-${{ matrix.arch }}/$RELEASE_CHANNEL" \
            --s3-endpoint "$S3_ENDPOINT" \
            --s3-region "$REGION" \
            --s3-bucket "$S3_BUCKET" \
            --s3-access-key "$S3_ACCESS_KEY" \
            --s3-secret-key "$S3_SECRET_KEY" \
            --s3-public-base-url "$PUBLIC_BASE" \
            --s3-public-base-key-prefix "$PLONDS_S3_PUBLIC_BASE_KEY_PREFIX" \
            --directory-upload-concurrency "$PLONDS_S3_DIRECTORY_UPLOAD_CONCURRENCY" \
            --multipart-threshold-mb "$PLONDS_S3_MULTIPART_THRESHOLD_MB" \
            --multipart-part-size-mb "$PLONDS_S3_MULTIPART_PART_SIZE_MB" \
            --multipart-concurrency "$PLONDS_S3_MULTIPART_CONCURRENCY" \
            --upload-attempts "$PLONDS_S3_UPLOAD_ATTEMPTS" \
            --upload-retry-max-delay-seconds "$PLONDS_S3_UPLOAD_RETRY_MAX_DELAY_SECONDS" \
            --upload-rate-kbps "$PLONDS_S3_UPLOAD_RATE_KBPS" \
            --force-http1 "$PLONDS_S3_FORCE_HTTP1"

          jq -e '.downloads.github.changedZipUrl and .downloads.github.filesZipUrl and .downloads.s3.changedFolderUrl and .downloads.s3.filesFolderUrl' plonds-assets/PLONDS-windows-${{ matrix.arch }}.json >/dev/null

      - name: Upload enriched PLONDS manifest to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" plonds-assets/PLONDS-windows-${{ matrix.arch }}.json --clobber
          if [[ "${{ matrix.arch }}" == x64 ]]; then
            gh release upload "$RELEASE_TAG" plonds-assets/PLONDS.json --clobber
          fi
