name: Publish AirApp SDK

# 发布 AirApp 开发者三件套到 GitHub Packages：
#   LanMountainDesktop.AirAppSdk   —— 轻应用与桌面组件开发的唯一 SDK
#   LanMountainDesktop.Core        —— SDK 依赖的共享契约与打包基础设施
#   LanMountainDesktop.AirAppTemplate —— dotnet new lmd-airapp 模板
#
# SDK 有独立于宿主的版本线，因此使用独立的 airapp-sdk-v* 标签触发，
# 不跟随宿主的 v0.x.y.z 发布标签。

on:
  push:
    tags:
      - 'airapp-sdk-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (defaults to the version in each csproj)'
        required: false
        type: string
      dry_run:
        description: 'Pack and validate only, do not push'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_gcServer: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish_AirApp_Packages
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          # 手工触发时填的版本走环境变量传给脚本，不直接拼进命令行——
          # 拼进去就是一条"输入内容会出现在 shell 脚本里"的注入面。
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version) -and $env:REF_TYPE -eq 'tag') {
            # airapp-sdk-v1.0.0 -> 1.0.0
            $version = $env:REF_NAME -replace '^airapp-sdk-v', ''
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Host 'No explicit version supplied; using the version declared in each csproj.'
          } else {
            Write-Host "Publishing version $version."
          }

      # 这道作业里没有 Restore，而宿主 csproj 会用 Exec 以 --no-restore 去编 AirAppHost
      # （LanMountainDesktop.csproj:107），于是 AirAppHost 的 obj/project.assets.json 根本不存在：
      # 2026-09-25 打 airapp-sdk-v1.0.1 时实测红在 error NETSDK1004（assets file not found），
      # 后面 Pack / Push 一步都没走到。与 Quality Check 作业同一先例（那边有 Restore 步）。
      - name: Restore
        run: dotnet restore LanMountainDesktop.slnx

      - name: Verify the single version line
        # 版本一致性由 AirAppSdkVersionConsistencyTests 守卫：
        # AirAppSdkInfo / AirAppSdk 包 / Core 包 / 模板默认版本必须一致。
        run: >
          dotnet test tests/LanMountainDesktop.Tests/LanMountainDesktop.Tests.csproj
          -c Release --no-restore
          --filter "FullyQualifiedName~AirAppSdkVersionConsistencyTests"

      - name: Pack
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          # 跑在 ubuntu-latest 上：反斜杠路径在 Linux 的 pwsh 里不是分隔符（".\scripts\x.ps1"
          # 会被当成一整串参数、Join-Path 出来的也是字面反斜杠），所以这里一律用正斜杠；
          # 脚本内部的默认路径与工程清单也同步改成了正斜杠（Windows 同样认）。
          #
          # 参数必须用**哈希表**splat，不能用数组：数组 splat 是按位置喂的（实测
          # `T @("-A","x","-B","y")` 得到 `A=-A B=x C=-B`），于是 "-Configuration" 成了 $OutputPath 的值、
          # 名字全被当成值往后错一格；错到第 5 个元素时位置用完，报的就是上次那个
          # "A positional parameter cannot be found that accepts argument '-NuGetPackagesPath'"。
          $packArgs = @{
            Configuration    = 'Release'
            OutputPath       = 'artifacts/nuget'
            NuGetPackagesPath = '.nuget/packages'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PACKAGE_VERSION)) {
            $packArgs['Version'] = $env:PACKAGE_VERSION
          }
          & ./scripts/Pack-AirAppPackages.ps1 @packArgs

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: airapp-packages
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 14

      - name: Push to GitHub Packages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: >
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
