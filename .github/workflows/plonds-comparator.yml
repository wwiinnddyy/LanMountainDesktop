name: PLONDS Comparator

concurrency:
  group: plonds-${{ github.event.release.tag_name || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

on:
  release:
    types:
      - published
      - prereleased
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string
      baseline_tag:
        description: 'Optional baseline tag (auto-detected if omitted)'
        required: false
        type: string
      channel:
        description: 'Update channel'
        required: false
        type: choice
        default: stable
        options:
          - stable
          - preview
      compare_method:
        description: 'Compare method'
        required: false
        type: choice
        default: file-compare
        options:
          - file-compare
          - commit-analyze
      hash_algorithm:
        description: 'Hash algorithm (file-compare only)'
        required: false
        type: choice
        default: sha256
        options:
          - sha256
          - md5

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve release context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
              CHANNEL="preview"
            else
              CHANNEL="stable"
            fi
            BASELINE_TAG_INPUT=""
            COMPARE_METHOD="file-compare"
            HASH_ALGORITHM="sha256"
          else
            RAW_TAG="${{ github.event.inputs.tag }}"
            if [[ "${RAW_TAG}" == v* ]]; then
              TAG="${RAW_TAG}"
            else
              TAG="v${RAW_TAG}"
            fi
            CHANNEL="${{ github.event.inputs.channel }}"
            BASELINE_TAG_INPUT="${{ github.event.inputs.baseline_tag }}"
            COMPARE_METHOD="${{ github.event.inputs.compare_method }}"
            HASH_ALGORITHM="${{ github.event.inputs.hash_algorithm }}"
          fi

          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=${CHANNEL}" >> "$GITHUB_ENV"
          echo "BASELINE_TAG_INPUT=${BASELINE_TAG_INPUT}" >> "$GITHUB_ENV"
          echo "COMPARE_METHOD=${COMPARE_METHOD}" >> "$GITHUB_ENV"
          echo "HASH_ALGORITHM=${HASH_ALGORITHM}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Build PLONDS tool
        run: dotnet build PenguinLogisticsOnlineNetworkDistributionSystem/src/Plonds.Tool/Plonds.Tool.csproj -c Release

      - name: Resolve baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_TAG=""
          BASELINE_VERSION=""

          if [[ -n "$BASELINE_TAG_INPUT" ]]; then
            NORMALIZED="$BASELINE_TAG_INPUT"
            if [[ "$NORMALIZED" != v* ]]; then NORMALIZED="v$NORMALIZED"; fi
            if gh release view "$NORMALIZED" --repo "${{ github.repository }}" --json tagName >/dev/null 2>&1; then
              BASELINE_TAG="$NORMALIZED"
              BASELINE_VERSION="${NORMALIZED#v}"
            else
              echo "Specified baseline tag not found: $NORMALIZED"
              exit 1
            fi
          else
            IS_PRERELEASE="$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isPrerelease --jq '.isPrerelease')"
            CANDIDATES="$(gh api "repos/${{ github.repository }}/releases?per_page=50" \
              --jq ".[] | select(.draft == false and .prerelease == ${IS_PRERELEASE} and .tag_name != \"${RELEASE_TAG}\") | .tag_name")"

            for CANDIDATE in $CANDIDATES; do
              CANDIDATE_VERSION="${CANDIDATE#v}"
              if [[ "$CANDIDATE_VERSION" == "$RELEASE_VERSION" ]]; then continue; fi
              if [[ "$(printf '%s\n%s\n' "$CANDIDATE_VERSION" "$RELEASE_VERSION" | sort -V | head -n 1)" != "$CANDIDATE_VERSION" ]]; then continue; fi
              if gh release download "$CANDIDATE" -p "files-windows-${{ matrix.arch }}.zip" -D /tmp/baseline-check --clobber 2>/dev/null; then
                BASELINE_TAG="$CANDIDATE"
                BASELINE_VERSION="${CANDIDATE#v}"
                rm -rf /tmp/baseline-check
                break
              fi
            done
          fi

          if [[ -n "$BASELINE_TAG" ]]; then
            if [[ "$BASELINE_VERSION" == "$RELEASE_VERSION" || "$(printf '%s\n%s\n' "$BASELINE_VERSION" "$RELEASE_VERSION" | sort -V | head -n 1)" != "$BASELINE_VERSION" ]]; then
              echo "Baseline must be earlier than the release version."
              exit 1
            fi
            echo "BASELINE_TAG=${BASELINE_TAG}" >> "$GITHUB_ENV"
            echo "BASELINE_VERSION=${BASELINE_VERSION}" >> "$GITHUB_ENV"
            echo "Resolved baseline: ${BASELINE_TAG}"
          else
            echo "No baseline found. This will be a full update."
          fi

      - name: Download payload zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plonds-input

          gh release download "$RELEASE_TAG" -p "files-windows-${{ matrix.arch }}.zip" -D plonds-input
          mv plonds-input/files-windows-${{ matrix.arch }}.zip plonds-input/current-files-windows-${{ matrix.arch }}.zip

          if [[ -n "$BASELINE_TAG" ]]; then
            gh release download "$BASELINE_TAG" -p "files-windows-${{ matrix.arch }}.zip" -D plonds-input
            mv plonds-input/files-windows-${{ matrix.arch }}.zip plonds-input/baseline-files-windows-${{ matrix.arch }}.zip
          fi

      - name: Run build-delta (file-compare)
        if: env.COMPARE_METHOD == 'file-compare'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plonds-output

          ARGS=(
            'run' '--project' 'PenguinLogisticsOnlineNetworkDistributionSystem/src/Plonds.Tool/Plonds.Tool.csproj'
            '--configuration' 'Release' '--'
            'build-delta'
            '--platform' 'windows-${{ matrix.arch }}'
            '--current-version' "$RELEASE_VERSION"
            '--current-zip' "$PWD/plonds-input/current-files-windows-${{ matrix.arch }}.zip"
            '--output-dir' "$PWD/plonds-output"
            '--channel' "$RELEASE_CHANNEL"
            '--hash-algorithm' "$HASH_ALGORITHM"
          )

          if [[ -n "$BASELINE_TAG" ]]; then
            ARGS+=(
              '--baseline-version' "$BASELINE_VERSION"
              '--baseline-zip' "$PWD/plonds-input/baseline-files-windows-${{ matrix.arch }}.zip"
            )
          fi

          dotnet "${ARGS[@]}"

      - name: Run build-delta-from-commits (commit-analyze)
        if: env.COMPARE_METHOD == 'commit-analyze'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plonds-output

          ARGS=(
            'run' '--project' 'PenguinLogisticsOnlineNetworkDistributionSystem/src/Plonds.Tool/Plonds.Tool.csproj'
            '--configuration' 'Release' '--'
            'build-delta-from-commits'
            '--platform' 'windows-${{ matrix.arch }}'
            '--current-version' "$RELEASE_VERSION"
            '--current-zip' "$PWD/plonds-input/current-files-windows-${{ matrix.arch }}.zip"
            '--output-dir' "$PWD/plonds-output"
            '--channel' "$RELEASE_CHANNEL"
            '--baseline-tag' "${BASELINE_TAG:-$RELEASE_TAG}"
            '--current-tag' "$RELEASE_TAG"
            '--hash-algorithm' "$HASH_ALGORITHM"
          )

          if [[ -n "$BASELINE_TAG" ]]; then
            ARGS+=(
              '--fallback-zip' "$PWD/plonds-input/baseline-files-windows-${{ matrix.arch }}.zip"
            )
          fi

          dotnet "${ARGS[@]}"

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f plonds-output/changed.zip ]]; then
            echo "Missing output: changed.zip"
            exit 1
          fi
          if [[ ! -f plonds-output/PLONDS.json ]]; then
            echo "Missing output: PLONDS.json"
            exit 1
          fi
          jq -e . plonds-output/PLONDS.json >/dev/null

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp plonds-output/changed.zip "plonds-output/changed-windows-${{ matrix.arch }}.zip"
          cp plonds-output/PLONDS.json "plonds-output/PLONDS-windows-${{ matrix.arch }}.json"
          gh release upload "$RELEASE_TAG" "plonds-output/changed-windows-${{ matrix.arch }}.zip" "plonds-output/PLONDS-windows-${{ matrix.arch }}.json" --clobber
          if [[ "${{ matrix.arch }}" == x64 ]]; then
            gh release upload "$RELEASE_TAG" plonds-output/changed.zip plonds-output/PLONDS.json --clobber
          fi

      - name: Persist run metadata
        shell: bash
        run: |
          mkdir -p plonds-run-metadata
          printf '%s' "$RELEASE_TAG" > plonds-run-metadata/tag.txt
          printf '%s' "$COMPARE_METHOD" > plonds-run-metadata/compare-method.txt

      - name: Upload run metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: plonds-run-metadata-${{ matrix.arch }}
          path: |
            plonds-run-metadata/tag.txt
            plonds-run-metadata/compare-method.txt
          if-no-files-found: error
          retention-days: 7

  notify-publisher:
    needs: compare
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start PLONDS Publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            RAW_TAG="${{ github.event.inputs.tag }}"
            if [[ "$RAW_TAG" == refs/tags/* ]]; then
              TAG="${RAW_TAG#refs/tags/}"
            elif [[ "$RAW_TAG" == v* ]]; then
              TAG="$RAW_TAG"
            else
              TAG="v$RAW_TAG"
            fi
          fi
          gh workflow run plonds-uploader.yml --repo "$GH_REPO" --ref "${{ github.event.repository.default_branch }}" -f tag="$TAG"
