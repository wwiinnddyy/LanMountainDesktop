name: Quality Check

on:
  pull_request:
  push:
    branches: [ main, master, dev, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  Solution_Name: LanMountainDesktop.slnx
  DOTNET_gcServer: 1

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore ${{ env.Solution_Name }}

      # -m:1 不是风格：本地一直用单节点构建就是因为多节点复用会让 Avalonia 的 XAML 任务与
      # 上一项目的输出抢同一个 dll。2026-09-25 run 36059631386 在 CI 里实测到这个形状——
      # 编译诊断 0 条，只有一句 `Avalonia error AVLN9999: The process cannot access the file
      # '…obj\Release\net10.0\LanMountainDesktop.dll' because it is being used by another process`，
      # 作业停在 Build、后面的 Test / Check unused members 全没执行。
      # 若换了 -m:1 还复现，下一步才是给它加重跑兜底（届时写清"上游修好后删哪段"）。
      - name: Build
        run: dotnet build ${{ env.Solution_Name }} -c Release --no-restore -m:1 -v minimal

      # 661 条测试此前在 CI 里一条都没跑：全仓唯一的 dotnet test 在 airapp-sdk-publish.yml，
      # 而且 --filter 只挑 AirAppSdkVersionConsistencyTests。
      # ⚠ 这一步（和下面 Check unused members）都是 bash 写法，必须写 shell: bash——
      #   windows-latest 的默认 shell 是 pwsh，c8b8ae0 那笔"把测试接进闸门"就是这么在 pwsh 里
      #   写了 `if ! …; then … fi`，ParserError 直接让作业停在解析上：**一条测试都没跑，
      #   而红的原因是语法错，不是测试失败**（本地 2026-09-25 从 run 300 的日志里查到）。
      #   所以这里除了补 shell，还加了一条"看到的用例数必须 ≥ 下限"的判据：解析错、filter 打错、
      #   工程没进解决方案，这三种"绿色但什么都没跑"的形态都会当场红。
      # EcosystemProbe 跑的是同级仓库里的外部 AirApp 产物，CI 上没有那些产物（探针会动态 Skip，
      # 全 Skip 的绿不算证据），所以它只在本地跑：dotnet test … --filter "Category=EcosystemProbe"。
      #
      # 重跑一次是因为 Avalonia headless 的每测试会话在清理阶段有线程归属竞态
      # （2026-09-24 本地实测：全量 6 趟里 3 趟各挂 1 条、快速子集 8 趟里 3 趟各挂 1 条，
      #  测试体本身是过的；详见 tests/LanMountainDesktop.Tests/AssemblyInfo.Xunit.cs 里已排除的两条修法）。
      # 连续两次失败才拦，真缺陷仍然会被挡住。
      - name: Test
        shell: bash
        run: |
          set -uo pipefail
          FILTER='Category!=EcosystemProbe'
          MIN_CASES=1000
          SUMMARY="${RUNNER_TEMP:-/tmp}/dotnet-test-summary.log"

          run_suite() {
            dotnet test "$Solution_Name" -c Release --no-build -v minimal --filter "$FILTER" 2>&1 | tee "$SUMMARY"
            return "${PIPESTATUS[0]}"
          }

          if ! run_suite; then
            echo "::warning title=Flaky headless test run::first dotnet test run failed, retrying once"
            run_suite || exit 1
          fi

          TOTAL="$(grep -oE 'Total: *[0-9]+' "$SUMMARY" | tail -1 | grep -oE '[0-9]+' || true)"
          if [ -z "${TOTAL:-}" ]; then
            TOTAL="$(grep -oE '总计: *[0-9]+' "$SUMMARY" | tail -1 | grep -oE '[0-9]+' || true)"
          fi
          if [ -z "${TOTAL:-}" ] || [ "$TOTAL" -lt "$MIN_CASES" ]; then
            echo "::error title=CI 没跑到测试::闸门只认领到 ${TOTAL:-0} 条用例（下限 ${MIN_CASES}）。红在这里说明 dotnet test 没真正执行或 filter/工程列表变了，见 G1-E。"
            exit 1
          fi
          echo "Test gate saw ${TOTAL} cases (floor ${MIN_CASES})."

      # 未使用私有成员必须为 0。Platform/Windows/Patches 是 Harmony 补丁，方法由 PatchAll
      # 反射调用，分析器看不见，所以排除；除此之外新增死成员要在这里被拦下。
      # IDE0052（只写不读）此前有 43 处：字段被赋值却从未读取，看着像接了线其实没接，
      # 全部清零后一并纳入闸门。
      # 2026-09-22 起闸门覆盖全部二进制而不是只有宿主：逐个量过 IDE0051+IDE0052 均为 0
      # （宿主 0 + 3 处在 Patches 里已排除、Core 0、启动器 0、AirAppSdk/Runtime/Host/DevServer/Template 全 0、
      #  安装器 0、Platform 0、Mobile 0）。启动器那 4 处与 AirAppHost 那 1 处的来历见
      #  AGENTS.md "未使用成员" 一节；Mobile.Android 需要 android workload，本地量到 0，不进 CI 循环。
      - name: Check unused members
        shell: bash
        run: |
          set -e
          dotnet format style desktop/LanMountainDesktop/LanMountainDesktop.csproj \
            --diagnostics IDE0051 IDE0052 --severity hidden --verify-no-changes \
            --exclude desktop/LanMountainDesktop/Platform/Windows/Patches
          for proj in \
            core/LanMountainDesktop.Core/LanMountainDesktop.Core.csproj \
            desktop/LanMountainDesktop.Launcher/LanMountainDesktop.Launcher.csproj \
            airapp/LanMountainDesktop.AirAppSdk/LanMountainDesktop.AirAppSdk.csproj \
            airapp/LanMountainDesktop.AirAppRuntime/LanMountainDesktop.AirAppRuntime.csproj \
            airapp/LanMountainDesktop.AirAppHost/LanMountainDesktop.AirAppHost.csproj \
            airapp/LanMountainDesktop.AirAppDevServer/LanMountainDesktop.AirAppDevServer.csproj \
            airapp/LanMountainDesktop.AirAppTemplate/LanMountainDesktop.AirAppTemplate.csproj \
            install/LanDesktopPLONDS.installer/LanDesktopPLONDS.installer.csproj \
            platform/LanMountainDesktop.Platform/LanMountainDesktop.Platform.csproj \
            mobile/LanMountainDesktop.Mobile/LanMountainDesktop.Mobile.csproj; do
            echo "::group::$proj"
            dotnet format style "$proj" --diagnostics IDE0051 IDE0052 --severity hidden --verify-no-changes
            echo "::endgroup::"
          done

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic || true
        continue-on-error: true
